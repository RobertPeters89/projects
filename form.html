<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="./js/form.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Quiz App</h1>
    </header>
    <nav class="navbar">
      <ul>
        <li>
          <a href="index.html"><img src="assets/house.svg" alt="" /></a>
        </li>
        <li>
          <a href="bookmarks.html">
            <img src="assets/bookmark.svg" alt="" />
          </a>
        </li>
        <li>
          <div class="active">
            <img src="assets/file-plus-corner.svg" alt="Add" />
          </div>
        </li>
        <li>
          <a href="profile.html"><img src="assets/user.svg" alt="" /></a>
        </li>
      </ul>
    </nav>
    <main>
      <form class="form" data-js="form">
        <label for="question">Your question</label>
        <textarea
          id="question"
          name="question"
          maxlength="150"
          required
        ></textarea>
        <p class="form__counter" data-js="question-counter">
          150 characters left
        </p>

        <label for="answer">Your answer</label>
        <textarea id="answer" name="answer" maxlength="150" required></textarea>
        <p class="form__counter" data-js="answer-counter">
          150 characters left
        </p>

        <label for="tag">Tag</label>
        <input type="text" id="tag" name="tag" required />

        <button type="submit" class="quiz-btn">Submit</button>
      </form>

      <section data-js="card-container"></section>
    </main>
  </body>
</html>
